
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داستان‌های عجیب</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#100d14;color:#fff;
  font-family:Tahoma,Arial,sans-serif;
  padding:22px;line-height:1.9
}
.container{max-width:650px;margin:auto}
h1{color:#ff4545;text-align:center;font-size:30px}
.sub{text-align:center;color:#bbb}
.card{
  background:#211a27;border:1px solid #493447;
  border-radius:16px;padding:18px;margin-top:20px
}
textarea{
  width:100%;min-height:230px;padding:14px;
  background:#100d14;color:white;border:1px solid #694052;
  border-radius:10px;font:16px Tahoma;line-height:2
}
button{
  border:0;border-radius:10px;padding:13px 18px;
  margin:5px;font-size:15px;font-weight:bold;cursor:pointer
}
.primary{background:#d92f45;color:white}
.secondary{background:#443342;color:white}
#caption{
  min-height:90px;text-align:center;color:#ff7777;
  font-size:20px;padding:15px
}
small{color:#aaa}
</style>
</head>
<body>
<div class="container">
<h1>👁 داستان‌های عجیب</h1>
<p class="sub">به دنیای تاریک و ترسناک داستان‌ها خوش آمدی...</p>

<div class="card">
<h3>📖 داستان خودت را بنویس</h3>
<textarea id="story">ساعت سه و هفده دقیقه نیمه‌شب بود.
امیر صدای در زدن شنید.
سه ضربه آرام...
تق تق تق...

صدایی از پشت در گفت:
امیر... در رو باز کن... خودمم!

اما امیر تنها در خانه بود.
گوشی‌اش زنگ خورد.
صدایی وحشت‌زده گفت:
به هیچ عنوان در رو باز نکن...
من پشت در نیستم!</textarea>

<button class="primary" onclick="playStory()">🔊 پخش داستان</button>
<button class="secondary" onclick="stopStory()">⏹ توقف</button>
<button class="secondary" onclick="nextLine()">⏭ جمله بعدی</button>
</div>

<div class="card">
<h3>🎙️ تنظیم صدای راوی</h3>
<label>سرعت صدا</label>
<input id="speed" type="range" min="0.6" max="1.2" step="0.1" value="0.8">
<br>
<small>صدای موجود به صداهای نصب‌شده روی گوشی و مرورگر بستگی دارد.</small>
</div>

<div class="card">
<h3>💬 متن در حال خواندن</h3>
<div id="caption">داستان آماده پخش است...</div>
</div>
</div>

<script>
let lines=[], current=0;

function prepare(){
  lines=document.getElementById('story').value
    .split(/[.!؟\n]+/)
    .map(x=>x.trim())
    .filter(x=>x.length>0);
}

function speakLine(){
  if(current>=lines.length){
    document.getElementById('caption').textContent='پایان داستان 👁';
    return;
  }
  speechSynthesis.cancel();
  let msg=new SpeechSynthesisUtterance(lines[current]);
  msg.lang='fa-IR';
  msg.rate=Number(document.getElementById('speed').value);
  msg.pitch=0.75;
  document.getElementById('caption').textContent=lines[current];
  msg.onend=()=>{
    current++;
    if(current<lines.length) speakLine();
    else document.getElementById('caption').textContent='پایان داستان 👁';
  };
  speechSynthesis.speak(msg);
}

function playStory(){
  prepare();
  current=0;
  speakLine();
}

function stopStory(){
  speechSynthesis.cancel();
  document.getElementById('caption').textContent='پخش متوقف شد.';
}

function nextLine(){
  prepare();
  speechSynthesis.cancel();
  current++;
  speakLine();
}
</script>
</body>
</html>
